
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Rumbo al Cielo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Rumbo al Cielo</span>

            <form method="post" action="{% url 'usuarios:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light">
                    Cerrar sesión
                </button>
            </form>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3">
                    ¡Bienvenido/a, {{ request.user.first_name }}!
                </h1>

                <p class="text-secondary">
                    Has iniciado sesión correctamente en Rumbo al Cielo.
                </p>

                <hr>

                <h2 class="h5">Módulos del sistema</h2>

                <p class="mb-0">
                    Aquí incorporaremos las opciones para consultar el menú,
                    reservar almuerzos y gestionar tus reservas.
                </p>
            </div>
        </div>
    </main>
</body>
</html>
