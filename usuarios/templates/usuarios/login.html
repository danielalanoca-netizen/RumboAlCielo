
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Rumbo al Cielo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f3f5f9;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }

        .titulo {
            color: #17365d;
            font-weight: 700;
        }

        .form-control {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="text-center mb-4">
            <h1 class="titulo h3">Rumbo al Cielo</h1>
            <p class="text-secondary">Inicia sesión con tu cuenta</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger" role="alert">
                El usuario o la contraseña son incorrectos.
                Verifica tus datos e inténtalo nuevamente.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}"
                       class="form-label">
                    Nombre de usuario
                </label>
                <input
                    type="text"
                    name="username"
                    id="{{ form.username.id_for_label }}"
                    class="form-control"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}"
                       class="form-label">
                    Contraseña
                </label>
                <input
                    type="password"
                    name="password"
                    id="{{ form.password.id_for_label }}"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Iniciar sesión
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            ¿Todavía no tienes cuenta?
            <a href="{% url 'usuarios:registro' %}">Regístrate aquí</a>
        </p>
    </main>
</body>
</html>
