
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña | Rumbo al Cielo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
    <main class="card border-0 shadow-sm p-4" style="max-width: 460px; width: 100%;">
        <h1 class="h3 text-center">Rumbo al Cielo</h1>
        <h2 class="h5 text-center mb-3">Recuperar contraseña</h2>
        <p class="text-secondary">
            Introduce el correo electrónico asociado a tu cuenta.
            Si existe una cuenta con ese correo, se generarán instrucciones
            para restablecer la contraseña.
        </p>

        <form method="post">
            {% csrf_token %}

            <label for="{{ form.email.id_for_label }}" class="form-label">
                Correo electrónico
            </label>
            <input
                type="email"
                name="email"
                id="{{ form.email.id_for_label }}"
                class="form-control mb-3"
                autocomplete="email"
                required
            >

            {% for error in form.email.errors %}
                <p class="text-danger small">{{ error }}</p>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100">
                Solicitar recuperación
            </button>
        </form>

        <a class="text-center mt-3" href="{% url 'usuarios:login' %}">
            Volver al inicio de sesión
        </a>
    </main>
</body>
</html>
